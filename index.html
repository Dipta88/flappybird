<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flap</title>
<meta name="theme-color" content="#70c5ce">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#cdeef0;--dk:#533846;--or:#fca044;--u:1px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16242b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16242b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:"Press Start 2P","Courier New",monospace;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;color:#fff}
#stage{position:relative;overflow:hidden;font-size:calc(var(--u)*10)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.ol{-webkit-text-stroke:calc(var(--u)*4) var(--dk);paint-order:stroke fill;text-shadow:0 calc(var(--u)*2) 0 var(--dk)}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*18);text-align:center;pointer-events:none;padding-bottom:calc(var(--u)*60)}
.ui>*{pointer-events:auto}
.hidden{display:none!important}
h1{margin:0;font-size:calc(var(--u)*38);font-weight:400;color:var(--or)}
h2{margin:0;font-size:calc(var(--u)*22);font-weight:400;color:var(--or);line-height:1.3}
.hint{font-size:calc(var(--u)*11);line-height:1.6}
button{font:inherit;font-size:calc(var(--u)*13);color:#fff;background:#e86101;border:calc(var(--u)*3) solid var(--dk);border-radius:calc(var(--u)*4);padding:calc(var(--u)*10) calc(var(--u)*18);box-shadow:inset 0 0 0 calc(var(--u)*2) #fbb868;text-shadow:0 calc(var(--u)*2) 0 var(--dk);cursor:pointer}
button:active{transform:translateY(calc(var(--u)*2));filter:brightness(.9)}
button:focus-visible{outline:calc(var(--u)*3) solid #fff;outline-offset:calc(var(--u)*2)}
#mute{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*8);padding:calc(var(--u)*6);font-size:calc(var(--u)*14);background:rgba(83,56,70,.55);border-color:transparent;box-shadow:none;text-shadow:none}
#hud{position:absolute;top:calc(var(--u)*50);left:0;right:0;text-align:center;font-size:calc(var(--u)*34);pointer-events:none}
.card{width:calc(var(--u)*210);background:#ded895;border:calc(var(--u)*4) solid var(--dk);border-radius:calc(var(--u)*6);box-shadow:inset 0 0 0 calc(var(--u)*3) #f7f3c6;padding:calc(var(--u)*16);display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*10) calc(var(--u)*10);align-items:center;text-align:right}
.card .lab{color:var(--or);font-size:calc(var(--u)*10);text-align:left;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #fff}
.card .num{font-size:calc(var(--u)*18);-webkit-text-stroke:calc(var(--u)*4) var(--dk);paint-order:stroke fill}
.card .num small{font-size:calc(var(--u)*8);color:#ff3b30;margin-right:calc(var(--u)*6)}
.medal{width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:50%;border:calc(var(--u)*4) solid var(--dk);box-shadow:inset 0 0 0 calc(var(--u)*4) rgba(255,255,255,.55);justify-self:start;grid-row:span 2}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="288" height="512"></canvas>
  <div id="hud" class="ol hidden">0</div>
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <div id="start" class="ui">
    <h1 class="ol">FLAP</h1>
    <h2 class="ol">GET READY</h2>
    <div class="hint ol">TAP TO FLAP</div>
    <button id="play">PLAY</button>
  </div>
  <div id="over" class="ui hidden">
    <h2 class="ol">GAME OVER</h2>
    <div class="card">
      <div class="medal" id="medal"></div>
      <div class="lab">SCORE</div><div class="num ol" id="sc" style="text-align:right">0</div>
      <div class="lab">BEST</div><div class="num ol" id="bs" style="text-align:right">0</div>
    </div>
    <button id="again">OK</button>
  </div>
</div>
<script>
(function(){
const W=288,H=512,GH=112,GY=H-GH,GAP=104,PW=52,SPEED=130,GRAV=1500,FLAP=-400,CAP=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
ctx.imageSmoothingEnabled=false;
let best=0,muted=false;
try{best=parseInt(localStorage.getItem('flap:best'))||0;muted=localStorage.getItem('flap:muted')==='1'}catch(e){}
$('mute').textContent=muted?'🔇':'🔊';

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H,3);
  stage.style.width=W*s+'px';stage.style.height=H*s+'px';stage.style.setProperty('--u',s+'px');
}
addEventListener('resize',fit);fit();

/* sound */
let ac=null;
function tone(f1,f2,dur,type,vol){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur);
  }catch(e){}
}

/* pixel bird sprite */
const ROWS=[
"....OOOOOOO......",
"..OOYYYYYOWWWO..",
".OYYYYYYOWWWWWO.",
".OYYYYYYOWWWEEWO",
"OYYYYYYYYOWWWEEO",
"OYYYYYYYYYYOOOOO",
"OYYYYYYYYYYYYYO.",
".OYYLLLLLLLLLO..",
"..OOLLLLLLLLOO..",
"....OOOOOOOO...."];
const PAL={O:'#533846',Y:'#f8c52c',L:'#fbe9a0',W:'#fff',E:'#533846'};
const spr=document.createElement('canvas');spr.width=20;spr.height=12;
(function(){
  const g=spr.getContext('2d');
  ROWS.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=r[x];if(c!=='.'){g.fillStyle=PAL[c];g.fillRect(x,y+1,1,1)}}});
  g.fillStyle=PAL.O;g.fillRect(12,6,8,6);
  g.fillStyle='#f8561e';g.fillRect(13,7,6,2);
  g.fillStyle='#d62b1a';g.fillRect(13,9,6,2);
})();

/* background layers */
function span(total,min,max){const a=[];let s=0;while(s<total){let w=min+Math.floor(Math.random()*(max-min));if(s+w>total||total-(s+w)<min)w=total-s;a.push(w);s+=w}return a}
let bx=0;const bld=span(W,22,40).map(w=>{const r={x:bx,w,h:30+Math.floor(Math.random()*40)};bx+=w;return r});
const bushes=[];for(let x=0;x<W;x+=36)bushes.push({x,w:28+Math.floor(Math.random()*14)});
const clouds=[];for(let x=0;x<W;x+=48)clouds.push({x,w:36+Math.floor(Math.random()*20),h:12+Math.floor(Math.random()*10)});

/* state */
let state='ready',bird,pipes,score,t=0,spawn=0,flash=0,dist=0;
function reset(){bird={x:84,y:H/2-50,vy:0,rot:0};pipes=[];score=0;spawn=0;flash=0;$('hud').textContent='0'}
reset();

function flap(){
  if(state==='dead')return;
  if(state==='ready'){state='play';$('start').classList.add('hidden');$('hud').classList.remove('hidden');spawn=.4}
  bird.vy=FLAP;tone(500,760,.1,'square',.05);
}
function die(){
  if(state==='dead')return;
  state='dead';flash=1;tone(260,60,.35,'sawtooth',.1);
  const nb=score>best;
  if(nb){best=score;try{localStorage.setItem('flap:best',String(best))}catch(e){}}
  setTimeout(()=>{
    $('sc').textContent=score;
    $('bs').innerHTML=(nb&&score>0?'<small>NEW</small>':'')+best;
    const m=score>=40?['#e5e4e2','#b9f2ff']:score>=30?['#f5c842','#ffe58a']:score>=20?['#cfd6dd','#f4f7fa']:score>=10?['#c67e3a','#e8a867']:null;
    const el=$('medal');el.style.visibility=m?'visible':'hidden';if(m)el.style.background='radial-gradient(circle at 35% 35%,'+m[1]+','+m[0]+')';
    $('hud').classList.add('hidden');$('over').classList.remove('hidden');
  },650);
}
function restart(){reset();state='ready';$('over').classList.add('hidden');$('start').classList.remove('hidden')}

stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  e.preventDefault();flap();
});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(state==='dead'){if(!$('over').classList.contains('hidden'))restart()}else flap();
  }
});
$('play').addEventListener('click',flap);
$('again').addEventListener('click',restart);
$('mute').addEventListener('click',e=>{
  e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';
  try{localStorage.setItem('flap:muted',muted?'1':'0')}catch(x){}
});

function update(dt){
  t+=dt;flash=Math.max(0,flash-dt*2.5);
  if(state!=='dead')dist+=dt;
  if(state==='ready'){bird.y=H/2-50+Math.sin(t*6)*6;bird.rot=0;return}
  bird.vy+=GRAV*dt;bird.y+=bird.vy*dt;
  bird.rot=Math.max(-.4,Math.min(1.45,bird.vy/430));
  if(state==='play'){
    spawn-=dt;
    if(spawn<=0){spawn=1.5;pipes.push({x:W+10,top:70+Math.floor(Math.random()*(GY-GAP-140)),done:false})}
    for(const p of pipes){
      p.x-=SPEED*dt;
      if(!p.done&&p.x+PW<bird.x){p.done=true;score++;$('hud').textContent=score;tone(988,1319,.12,'square',.05)}
      if(bird.x+12>p.x&&bird.x-12<p.x+PW&&(bird.y-9<p.top||bird.y+9>p.top+GAP))die();
    }
    pipes=pipes.filter(p=>p.x>-PW-10);
    if(bird.y<-10){bird.y=-10;bird.vy=0}
  }
  if(bird.y+10>GY){bird.y=GY-10;bird.vy=0;bird.rot=1.45;if(state==='play')die()}
}

function pipeBox(x,y,w,h){
  ctx.fillStyle='#533846';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#73bf2e';ctx.fillRect(x+2,y+2,w-4,h-4);
  ctx.fillStyle='#9ce659';ctx.fillRect(x+4,y+2,5,h-4);
  ctx.fillStyle='#558022';ctx.fillRect(x+w-10,y+2,8,h-4);
}
function draw(){
  ctx.fillStyle='#70c5ce';ctx.fillRect(0,0,W,H);
  // clouds
  const co=(dist*8)%W;ctx.fillStyle='#e6f7e9';
  for(let k=0;k<2;k++)clouds.forEach(c=>{const x=Math.round(c.x-co+k*W),y=GY-70-c.h;ctx.fillRect(x+6,y,c.w-12,4);ctx.fillRect(x+2,y+4,c.w-4,4);ctx.fillRect(x,y+8,c.w,c.h)});
  // city
  const bo=(dist*16)%W;
  for(let k=0;k<2;k++)bld.forEach(b=>{
    const x=Math.round(b.x-bo+k*W),y=GY-b.h-20;
    ctx.fillStyle='#bfe5d8';ctx.fillRect(x,y,b.w,b.h+22);
    ctx.fillStyle='#a5d6c6';
    for(let yy=y+6;yy<GY-26;yy+=10)for(let xx=x+4;xx<x+b.w-5;xx+=9)ctx.fillRect(xx,yy,4,5);
  });
  // bushes
  const so=(dist*32)%W;
  for(let k=0;k<2;k++)bushes.forEach(b=>{
    const x=Math.round(b.x-so+k*W),y=GY-18;
    ctx.fillStyle='#5fcf4a';ctx.fillRect(x+6,y,b.w-12,4);ctx.fillRect(x+2,y+4,b.w-4,4);ctx.fillRect(x,y+8,b.w,10);
    ctx.fillStyle='#3fa43a';ctx.fillRect(x,y+14,b.w,4);
  });
  // pipes
  pipes.forEach(p=>{
    const x=Math.round(p.x);
    pipeBox(x+2,-4,PW-4,p.top-CAP+4);
    pipeBox(x,p.top-CAP,PW,CAP);
    pipeBox(x,p.top+GAP,PW,CAP);
    pipeBox(x+2,p.top+GAP+CAP,PW-4,GY-(p.top+GAP+CAP)+4);
  });
  // ground
  ctx.fillStyle='#ded895';ctx.fillRect(0,GY,W,GH);
  ctx.fillStyle='#533846';ctx.fillRect(0,GY,W,3);
  ctx.fillStyle='#9de64e';ctx.fillRect(0,GY+3,W,9);
  const go=Math.floor((state==='dead'?lastDist:dist*SPEED))%24;
  ctx.fillStyle='#73bf2e';
  for(let x=-24;x<W+24;x+=24)for(let r=0;r<9;r++)ctx.fillRect(x-go+r,GY+3+r,10,1);
  ctx.fillStyle='#f0f4b8';ctx.fillRect(0,GY+12,W,2);
  ctx.fillStyle='#533846';ctx.fillRect(0,GY+14,W,2);
  ctx.fillStyle='#d2c670';ctx.fillRect(0,GY+16,W,4);
  // bird
  const fr=state==='dead'||bird.vy>380?1:Math.floor(t*(state==='ready'?9:14))%3;
  ctx.save();
  ctx.translate(Math.round(bird.x),Math.round(bird.y));ctx.rotate(bird.rot);ctx.scale(2,2);ctx.translate(-9,-6);
  ctx.drawImage(spr,0,0);
  const wy=[3,5,7][fr];
  ctx.fillStyle='#533846';ctx.fillRect(2,wy,7,4);
  ctx.fillStyle='#fff';ctx.fillRect(3,wy+1,5,2);
  ctx.fillStyle='#f8c52c';ctx.fillRect(3,wy+2,2,1);
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H)}
}
let lastDist=0;
let last=performance.now();
function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;
  if(state!=='dead')lastDist=dist*SPEED;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{last=performance.now()});
})();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
